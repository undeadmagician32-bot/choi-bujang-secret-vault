<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYTE BACK | 점령된 자료실</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
.eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
.notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
ul { list-style: none; display: grid; gap: 12px; padding: 0; }
li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
strong { display: block; font-size: 18px; margin-bottom: 5px; }
li span { color: #bfd0e5; }
.auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
.auth h2 { margin: 0 0 12px; font-size: 18px; }
.auth form { display: grid; gap: 10px; }
.auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
.auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
.auth button { padding: 10px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
.auth button:disabled { opacity: .6; cursor: wait; }
.auth .status { margin: 0 0 12px; color: #ecf4ff; }
.auth .error { margin: 12px 0 0; color: #ffb4c0; font-size: 15px; }
.memos { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
.memos h2 { margin: 0 0 12px; font-size: 18px; }
.memos form { display: grid; gap: 10px; margin-bottom: 14px; }
.memos label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
.memos input, .memos textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font: inherit; font-size: 16px; }
.memos textarea { min-height: 84px; resize: vertical; }
.memos .row { display: flex; gap: 8px; flex-wrap: wrap; }
.memos button { padding: 8px 12px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 15px; font-weight: 700; cursor: pointer; }
.memos button.secondary { background: #51667c; color: #ecf4ff; }
.memos button.danger { background: #d07384; color: #101a28; }
.memos button:disabled { opacity: .6; cursor: wait; }
.memos ul { margin: 0; }
.memos .error { margin: 0 0 12px; color: #ffb4c0; font-size: 15px; }
.memos .empty { color: #bfd0e5; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<div class="eyebrow">BYTE BACK · 2단계 자료 이동</div>
<h1>점령된 자료실</h1>
<p>자료는 이제 코드 밖 보관함에 있고, 서버 함수가 읽어 옵니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
<div class="notice">자료 주소는 이제 서버가 로그인 토큰을 검사합니다. 로그인하지 않으면 자료가 보이지 않습니다. 허용 경로와 호출 횟수 제한은 아직 없습니다.</div>
<section class="auth" id="auth" aria-live="polite">
<div id="signed-out" hidden>
<h2>로그인</h2>
<form id="login-form">
<label>이메일<input id="email" type="email" autocomplete="email" required></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit" id="login-button">로그인</button>
</form>
</div>
<div id="signed-in" hidden>
<p class="status">로그인됨: <strong id="who"></strong></p>
<button type="button" id="logout-button">로그아웃</button>
</div>
<p class="error" id="auth-error" role="alert" hidden></p>
</section>
<section class="memos" id="memos" hidden>
<h2>내 메모</h2>
<p class="error" id="memo-error" role="alert" hidden></p>
<form id="memo-form">
<label>제목<input id="memo-title" maxlength="200" required></label>
<label>내용<textarea id="memo-body" maxlength="5000"></textarea></label>
<div class="row">
<button type="submit" id="memo-save">메모 추가</button>
<button type="button" class="secondary" id="memo-cancel" hidden>수정 취소</button>
</div>
</form>
<ul id="memo-list" aria-live="polite"></ul>
</section>
<ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
</main>
<script type="module">
// 화면 코드에는 키가 없습니다. 로그인·세션 갱신·로그아웃은 서버 함수(/api/auth/*)가 맡고,
// 자료는 서버 함수(/api/notes, /api/memos)로만 요청합니다.
const signedOut = document.querySelector('#signed-out');
const signedIn = document.querySelector('#signed-in');
const who = document.querySelector('#who');
const errorBox = document.querySelector('#auth-error');
const form = document.querySelector('#login-form');
const loginButton = document.querySelector('#login-button');
const showError = message => { errorBox.textContent = message || ''; errorBox.hidden = !message; };
const list = document.querySelector('#notes');
const showNotesMessage = message => {
  const item = document.createElement('li');
  item.textContent = message;
  list.replaceChildren(item);
};
// 로그인 세션: 서버가 돌려준 토큰을 이 브라우저에 보관합니다. 비밀번호는 보관하지 않습니다.
const SESSION_KEY = 'vault-session';
let authSession = null;
let refreshing = null;
const readStored = () => {
  try {
    const stored = JSON.parse(localStorage.getItem(SESSION_KEY));
    return stored && typeof stored.access_token === 'string' && typeof stored.refresh_token === 'string'
      && Number.isFinite(stored.expires_at) ? stored : null;
  } catch { return null; }
};
const writeStored = stored => {
  try {
    if (stored) localStorage.setItem(SESSION_KEY, JSON.stringify(stored));
    else localStorage.removeItem(SESSION_KEY);
  } catch { /* 저장소를 쓸 수 없으면 이 탭에서만 유지됩니다 */ }
};
const authPost = async (path, body, token) => {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = `Bearer ${token}`;
  const response = await fetch(path, {
    method: 'POST', cache: 'no-store', headers, body: JSON.stringify(body ?? {}),
  });
  let data = null;
  try { data = await response.json(); } catch { /* 본문 없음 */ }
  return { response, data };
};
const setSession = next => { authSession = next; writeStored(next); render(next); };
const refreshSession = () => {
  if (!authSession) return Promise.resolve(null);
  refreshing ??= (async () => {
    try {
      const { response, data } = await authPost('/api/auth/refresh', { refresh_token: authSession.refresh_token });
      if (!response.ok) { setSession(null); return null; }
      setSession(data);
      return data;
    } catch { return null; } finally { refreshing = null; }
  })();
  return refreshing;
};
// 만료 1분 전이면 먼저 갱신해서, 서버에 보낼 토큰은 항상 쓸 수 있는 것으로 돌려줍니다.
const freshToken = async () => {
  if (!authSession) throw new Error('로그인이 필요합니다.');
  if (authSession.expires_at * 1000 - Date.now() < 60000) {
    const next = await refreshSession();
    if (!next) throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요.');
  }
  return authSession.access_token;
};
// 로그인 토큰을 Authorization 머리글로 보냅니다. userId·role 같은 값은 보내지 않습니다.
// 자료를 보여 줄지는 서버(api/notes.js)가 토큰을 검사해서 정합니다.
let notesRequest = 0;
const loadNotes = async session => {
  const mine = ++notesRequest;
  if (!session) {
    showNotesMessage('로그인하면 가상 자료가 보입니다.');
    return;
  }
  showNotesMessage('가상 자료를 불러오는 중입니다.');
  try {
    const token = await freshToken();
    const response = await fetch('/api/notes', {
      cache: 'no-store',
      headers: { Authorization: `Bearer ${token}` },
    });
    if (mine !== notesRequest) return;
    if (response.status === 401) throw new Error('로그인이 확인되지 않아 자료를 보여 줄 수 없습니다.');
    if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
    const data = await response.json();
    if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
    if (mine !== notesRequest) return;
    list.replaceChildren(...data.notes.map(note => {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const content = document.createElement('span');
      title.textContent = note.title;
      content.textContent = note.content;
      item.append(title, content);
      return item;
    }));
  } catch (error) {
    if (mine === notesRequest) showNotesMessage(error.message);
  }
};
// 로그인한 사람의 메모 추가·수정·삭제. 서버가 토큰으로 사용자를 확인하고 owner_id를 정합니다.
const memosBox = document.querySelector('#memos');
const memoForm = document.querySelector('#memo-form');
const memoTitle = document.querySelector('#memo-title');
const memoBody = document.querySelector('#memo-body');
const memoSave = document.querySelector('#memo-save');
const memoCancel = document.querySelector('#memo-cancel');
const memoList = document.querySelector('#memo-list');
const memoError = document.querySelector('#memo-error');
let currentSession = null;
let editingId = null;
const showMemoError = message => { memoError.textContent = message || ''; memoError.hidden = !message; };
const memoApi = async (path, { method = 'GET', body } = {}) => {
  const headers = { Authorization: `Bearer ${await freshToken()}` };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const response = await fetch(path, {
    method, cache: 'no-store', headers, body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  try { data = await response.json(); } catch { /* 본문 없음 */ }
  if (!response.ok) {
    const reasons = {
      LOGIN_REQUIRED: '로그인이 확인되지 않았습니다.', NOT_FOUND: '메모를 찾을 수 없습니다.',
      INVALID_MEMO: '제목은 1~200자, 내용은 5000자 이하로 적어 주세요.',
      INVALID_ID: '메모 번호가 올바르지 않습니다.', ID_EXISTS: '이미 있는 메모 번호입니다.',
    };
    throw new Error(reasons[data?.error] ?? `요청이 거부되었습니다 (${response.status}).`);
  }
  return data;
};
const resetMemoForm = () => {
  editingId = null;
  memoForm.reset();
  memoSave.textContent = '메모 추가';
  memoCancel.hidden = true;
};
const loadMemos = async () => {
  try {
    const memos = await memoApi('/api/memos');
    if (!Array.isArray(memos)) throw new Error('메모 형식이 맞지 않습니다.');
    const items = memos.map(memo => {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      const row = document.createElement('div');
      const edit = document.createElement('button');
      const del = document.createElement('button');
      title.textContent = memo.title;
      body.textContent = memo.body;
      row.className = 'row';
      edit.type = 'button'; edit.className = 'secondary'; edit.textContent = '수정';
      del.type = 'button'; del.className = 'danger'; del.textContent = '삭제';
      edit.addEventListener('click', () => {
        editingId = memo.id;
        memoTitle.value = memo.title;
        memoBody.value = memo.body;
        memoSave.textContent = '수정 저장';
        memoCancel.hidden = false;
        memoTitle.focus();
      });
      del.addEventListener('click', async () => {
        showMemoError('');
        del.disabled = true;
        try {
          await memoApi(`/api/memos/${memo.id}`, { method: 'DELETE' });
          if (editingId === memo.id) resetMemoForm();
          await loadMemos();
        } catch (error) {
          del.disabled = false;
          showMemoError(`삭제하지 못했습니다: ${error.message}`);
        }
      });
      row.append(edit, del);
      item.append(title, body, row);
      return item;
    });
    if (!items.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '아직 메모가 없습니다.';
      items.push(empty);
    }
    memoList.replaceChildren(...items);
  } catch (error) {
    showMemoError(`메모를 불러오지 못했습니다: ${error.message}`);
  }
};
memoForm.addEventListener('submit', async event => {
  event.preventDefault();
  showMemoError('');
  memoSave.disabled = true;
  const wasEditing = editingId;
  try {
    const payload = { title: memoTitle.value, body: memoBody.value };
    if (wasEditing) await memoApi(`/api/memos/${wasEditing}`, { method: 'PUT', body: payload });
    else await memoApi('/api/memos', { method: 'POST', body: payload });
    resetMemoForm();
    await loadMemos();
  } catch (error) {
    showMemoError(`${wasEditing ? '수정' : '추가'}하지 못했습니다: ${error.message}`);
  } finally {
    memoSave.disabled = false;
  }
});
memoCancel.addEventListener('click', () => { showMemoError(''); resetMemoForm(); });
const renderMemos = session => {
  currentSession = session;
  memosBox.hidden = !session;
  showMemoError('');
  resetMemoForm();
  memoList.replaceChildren();
  if (session) loadMemos();
};
let shownToken = null;
const render = session => {
  signedOut.hidden = Boolean(session);
  signedIn.hidden = !session;
  who.textContent = session?.email ?? '';
  const token = session?.access_token ?? null;
  if (token !== shownToken) {
    const wasUser = Boolean(shownToken);
    shownToken = token;
    loadNotes(session);
    // 토큰만 갱신된 경우에는 입력 중인 내용을 지우지 않고 세션만 바꿉니다.
    if (wasUser && session) currentSession = session;
    else renderMemos(session);
  }
};
showNotesMessage('로그인하면 가상 자료가 보입니다.');
form.addEventListener('submit', async event => {
  event.preventDefault();
  showError('');
  loginButton.disabled = true;
  try {
    const { response, data } = await authPost('/api/auth/login', {
      email: form.email.value.trim(),
      password: form.password.value,
    });
    if (response.ok) {
      setSession(data);
    } else {
      const reason = data?.message
        ?? (data?.error === 'AUTH_NOT_CONFIGURED' ? '서버의 로그인 설정이 아직 없습니다.' : `오류 ${response.status}`);
      showError(`로그인하지 못했습니다: ${reason}`);
    }
  } catch {
    showError('로그인하지 못했습니다: 서버에 연결하지 못했습니다.');
  } finally {
    loginButton.disabled = false;
    form.password.value = '';
  }
});
document.querySelector('#logout-button').addEventListener('click', async () => {
  showError('');
  const token = authSession?.access_token;
  setSession(null);
  if (!token) return;
  try {
    const { response } = await authPost('/api/auth/logout', {}, token);
    if (!response.ok) showError('이 브라우저에서는 로그아웃했지만, 서버에서 로그인 세션을 취소하지 못했습니다.');
  } catch {
    showError('이 브라우저에서는 로그아웃했지만, 서버에서 로그인 세션을 취소하지 못했습니다.');
  }
});
authSession = readStored();
render(authSession);
</script>
</body>
</html>
