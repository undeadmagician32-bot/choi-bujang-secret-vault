<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a28">
<title>오프라인 | 내 자료실</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
main { max-width: 560px; margin: 0 auto; padding: 56px 22px; }
h1 { font-size: 28px; }
p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
</style>
</head>
<body>
<main>
<h1>인터넷에 연결되어 있지 않습니다</h1>
<p>자료실은 연결된 상태에서 서버가 로그인을 확인한 뒤에만 열립니다. 이 기기에는 메모나 로그인 정보를 미리 저장해 두지 않았으므로, 오프라인에서는 자료를 볼 수 없습니다.</p>
<p>연결이 돌아오면 이 페이지를 새로 고쳐 주세요. 앱을 설치했는지와 관계없이 기기 승인은 서버가 정합니다.</p>
</main>
</body>
</html>
